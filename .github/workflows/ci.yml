name: CI
on:
  push:
    branches: [ci-rules-hash-order]
  workflow_dispatch:

jobs:
  lint:
    name: "Lint"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Get clang-format-20
        run: sudo apt-get install --no-install-recommends -y clang-format-20
      - name: Set clang-format-20 as default
        run: |
          sudo update-alternatives --install /usr/bin/clang-format clang-format /usr/bin/clang-format-20 100
          sudo update-alternatives --set clang-format /usr/bin/clang-format-20
      - name: Run linters
        run: ./Testing/lint.sh

  build-and-test:
    name: "Build and Test"
    needs: lint
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@083175551ceeceebc757ebee2127fde78840ca77 # 0.18.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ matrix.os }}
          repository-cache: true
      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: latest-stable
      - name: Test
        run: |
          bazel test \
            --test_output=errors \
            --verbose_failures \
            --define=SANTA_BUILD_TYPE=adhoc \
            :unit_tests
